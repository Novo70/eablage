# Schema and configuration/build files are local resources, never served over HTTP.
<Directory /var/www/html>
    <FilesMatch "(?i)(?:\.(?:sql|conf|ini)$|^(?:Dockerfile|\.dockerignore)$)">
        Require all denied
    </FilesMatch>
</Directory>

# Same-origin framing supports the embedded PDF viewer. Applies to error pages too.
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set X-Frame-Options "SAMEORIGIN"

# Local PDF.js ES modules and WebAssembly resources.
AddType application/javascript .mjs
AddType application/wasm .wasm
