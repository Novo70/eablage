# Schema and configuration/build files are local resources, never served over HTTP.
<Directory /var/www/html>
    <FilesMatch "(?i)(?:\.(?:sql|conf|ini)$|^(?:Dockerfile|\.dockerignore)$)">
        Require all denied
    </FilesMatch>
</Directory>

# Local PDF.js ES modules and WebAssembly resources.
AddType application/javascript .mjs
AddType application/wasm .wasm
