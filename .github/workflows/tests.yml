name: Tests

on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: [develop, main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: PHP und Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: PHP installieren
        run: sudo apt-get update && sudo apt-get install -y php8.3-cli php8.3-mysql php8.3-mbstring php8.3-curl
      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --require-hashes -r backend/requirements.txt
          python -m pip install -r tests/requirements.txt
      - name: Release-Angaben prüfen
        run: python scripts/release_metadata.py
      - name: PHP-Syntax und Helfer prüfen
        run: |
          find web tests -name '*.php' -print0 | xargs -0 -n 1 php -l
          for file in tests/*.php; do php "$file"; done
      - name: Backend prüfen
        run: PYTHONPATH=backend python -m pytest backend/tests -q
      - name: PHP-/API-Brücken prüfen
        run: |
          python tests/deployment_limits.py -v
          python tests/backend_client_integration.py -v
          python tests/metadata_php_integration.py -v
          python tests/ollama_php_integration.py -v
          python tests/ollama_settings_integration.py -v

  javascript:
    name: JavaScript (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [dom, browser]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: PHP installieren
        run: sudo apt-get update && sudo apt-get install -y php8.3-cli php8.3-mysql php8.3-mbstring
      - run: npm ci --ignore-scripts
      - if: matrix.suite == 'browser'
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:${{ matrix.suite }}

  integration:
    name: MariaDB und OCR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: eablage-ci-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      EABLAGE_TEST_DB_PASSWORD: eablage-ci-only
      PHP_BIN: php
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Systemabhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-mysql php8.3-mbstring php8.3-curl poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng fonts-dejavu-core
      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --require-hashes -r backend/requirements.txt
          python -m pip install -r tests/requirements.txt
      - name: Datenbank und echte Arbeitsabläufe prüfen
        env:
          EABLAGE_TEST_DB_PORT: ${{ job.services.mariadb.ports['3306'] }}
        run: |
          php tests/document_search.php
          php tests/document_links.php
          php tests/empty_master_data.php
          python tests/document_schema_integration.py -v
          python tests/document_numbers_migration.py -v
          python tests/document_numbers_integration.py
          python tests/document_links_integration.py -v
          python tests/ollama_background_integration.py -v
          python tests/inbox_integration.py -v
          python tests/ocr_integration.py -v
          python tests/archive_integration.py

  apache:
    name: Apache-Image und HTTP-Header
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - run: docker build -t eablage-web-test web
      - name: Ausgeliefertes Image prüfen
        run: |
          docker run -d --name eablage-web-test -p 127.0.0.1:18080:80 eablage-web-test
          trap 'docker logs eablage-web-test; docker rm -f eablage-web-test' EXIT
          python tests/apache_headers.py http://127.0.0.1:18080

  deployment:
    name: Windows-Deployment
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./tests/deployment_checks.ps1
