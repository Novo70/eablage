name: PDF.js-Aktualisierung prüfen

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Versionsvergleich prüfen
        run: php tests/pdfjs_update.php
      - name: Offizielles Release und Sicherheitsmeldungen prüfen
        run: |
          set -o pipefail
          php scripts/check_pdfjs_release.php | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
